name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hs
          POSTGRES_PASSWORD: hs
          POSTGRES_DB: healthyskin
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hs:hs@localhost:5432/healthyskin
      DATABASE_URL_UNPOOLED: postgresql://hs:hs@localhost:5432/healthyskin
      # Base descartable de CI: los tests de integración la vacían
      TEST_DATABASE_URL: postgresql://hs:hs@localhost:5432/healthyskin
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-0123
      ADMIN_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run db:seed
      - run: npm run build
